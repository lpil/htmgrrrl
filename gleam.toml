name = "htmgrrrl"
version = "0.3.0"
gleam = ">= 1.12.0"

description = "Gleam bindings to htmerl, the fast and memory efficient Erlang HTML SAX parser."
licences = ["Apache-2.0"]

repository = { type = "github", user = "lpil", repo = "htmgrrrl" }
links = [
  { title = "Website", href = "https://gleam.run" },
  { title = "Sponsor", href = "https://github.com/sponsors/lpil" },
]


[dependencies]
gleam_stdlib = ">= 0.60.0 and < 1.0.0"
htmerl = ">= 0.1.0 and < 1.0.0"
houdini = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
birdie = ">= 1.3.2 and < 2.0.0"
